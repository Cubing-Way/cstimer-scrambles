<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cstimer-scrambles demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --fg: #1a1a1a;
        --muted: #666;
        --card: #fff;
        --border: #ddd;
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #eee;
          --muted: #999;
          --card: #1e1e1e;
          --border: #333;
          --accent: #60a5fa;
        }
      }
      body {
        margin: 0;
        padding: 32px 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
      }
      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      select,
      button {
        font: inherit;
        padding: 8px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--fg);
      }
      button {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      #scramble {
        margin: 24px 0 8px;
        padding: 20px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        font:
          1.5rem/1.6 ui-monospace,
          monospace;
        word-spacing: 0.3em;
        white-space: pre-wrap;
        min-height: 2em;
      }
      #image {
        margin: 16px 0;
      }
      /* The images have no background of their own, so they sit on the page. */
      #image svg {
        display: block;
        width: 100%;
        max-width: 480px;
        height: auto;
        max-height: 360px;
      }
      /* Relays and multi-blind number each puzzle in black; use the page's text color. */
      #image svg > text[text-anchor='start'] {
        fill: var(--fg) !important;
      }
      .meta {
        color: var(--muted);
        font-size: 0.9rem;
      }
      h2 {
        margin-top: 48px;
      }
      .colors {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 12px 0;
      }
      .colors label,
      .controls label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      input[type='color'] {
        width: 36px;
        height: 28px;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: none;
      }
      /* Shown at the size set with setImageSize, but never wider than the page. */
      #puzzle-image svg {
        display: block;
        max-width: 100%;
        height: auto;
      }
      #puzzle-scramble {
        margin: 16px 0 8px;
        font:
          1.1rem/1.6 ui-monospace,
          monospace;
        word-spacing: 0.3em;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>cstimer-scrambles</h1>
      <p class="meta">
        csTimer's scramble generators running in your browser.
        <a href="https://github.com/Cubing-Way/cstimer-scrambles">Source on GitHub</a>
      </p>
      <div class="controls">
        <select id="event" aria-label="Scramble type"></select>
        <button id="next">New scramble</button>
      </div>
      <div id="scramble"></div>
      <div id="image"></div>
      <p class="meta" id="info"></p>

      <h2>Puzzle class</h2>
      <p class="meta">
        <code>new Puzzle(id)</code> with its own colors, image size and scramble method.
      </p>
      <div class="controls">
        <select id="puzzle" aria-label="Puzzle"></select>
        <select id="method" aria-label="Scramble method"></select>
        <label>Size <input id="size" type="range" min="100" max="480" value="300" /></label>
        <button id="puzzle-next">Scramble</button>
        <button id="puzzle-reset">Solve</button>
      </div>
      <div class="colors" id="colors"></div>
      <div id="puzzle-scramble"></div>
      <div id="puzzle-image"></div>
      <p class="meta" id="puzzle-info"></p>
    </main>
    <script type="module">
      import {
        listEvents,
        getScramble,
        getScrambleImage,
        hasScrambleImage,
        Puzzle,
        listPuzzles,
      } from './index.mjs';

      const select = document.getElementById('event');
      const out = document.getElementById('scramble');
      const info = document.getElementById('info');
      const image = document.getElementById('image');

      // One group per puzzle, in registration order.
      const groups = new Map();
      for (const event of listEvents()) {
        let group = groups.get(event.puzzle);
        if (!group) {
          group = document.createElement('optgroup');
          group.label = event.puzzle;
          groups.set(event.puzzle, group);
          select.append(group);
        }
        group.append(new Option(`${event.name} (${event.id})`, event.id));
      }

      function next() {
        const start = performance.now();
        const scramble = getScramble(select.value);
        const ms = performance.now() - start;
        out.textContent = scramble;
        info.textContent = `${scramble.split(/\s+/).length} moves, generated in ${ms.toFixed(0)} ms`;
        image.innerHTML = hasScrambleImage(select.value)
          ? getScrambleImage(select.value, scramble)
          : '<p class="meta">No image for this puzzle.</p>';
      }

      document.getElementById('next').addEventListener('click', next);
      select.addEventListener('change', next);
      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && e.target === document.body) {
          e.preventDefault();
          next();
        }
      });
      next();

      // Puzzle class: one Puzzle object per puzzle, so each keeps its own settings.
      const puzzles = new Map(listPuzzles().map((id) => [id, new Puzzle(id)]));
      const puzzleSelect = document.getElementById('puzzle');
      const methodSelect = document.getElementById('method');
      const sizeInput = document.getElementById('size');
      const colorsDiv = document.getElementById('colors');
      const puzzleScramble = document.getElementById('puzzle-scramble');
      const puzzleImage = document.getElementById('puzzle-image');
      const puzzleInfo = document.getElementById('puzzle-info');
      for (const [id, puzzle] of puzzles) puzzleSelect.append(new Option(puzzle.name, id));

      const current = () => puzzles.get(puzzleSelect.value);
      // <input type="color"> wants #rrggbb.
      const long = (c) => (c.length === 4 ? '#' + [...c.slice(1)].map((x) => x + x).join('') : c);

      function draw() {
        const puzzle = current();
        puzzle.setImageSize(Number(sizeInput.value));
        puzzleScramble.textContent = puzzle.getScramble() || '(solved)';
        puzzleImage.innerHTML = puzzle.getImage();
        puzzleInfo.textContent = `csTimer scramble type: ${puzzle.getScrambleType()}`;
      }

      function showPuzzle() {
        const puzzle = current();
        methodSelect.replaceChildren(...puzzle.getScrambleMethods().map((m) => new Option(m, m)));
        methodSelect.value = puzzle.getScrambleMethod();
        colorsDiv.replaceChildren();
        for (const [face, color] of Object.entries(puzzle.getColors())) {
          const label = document.createElement('label');
          const input = document.createElement('input');
          input.type = 'color';
          input.value = long(color);
          input.addEventListener('input', () => {
            puzzle.setColor(face, input.value);
            draw();
          });
          label.append(input, face);
          colorsDiv.append(label);
        }
        draw();
      }

      puzzleSelect.addEventListener('change', showPuzzle);
      methodSelect.addEventListener('change', () => {
        current().setScrambleMethod(methodSelect.value);
        current().scramble();
        draw();
      });
      sizeInput.addEventListener('input', draw);
      document.getElementById('puzzle-next').addEventListener('click', () => {
        current().scramble();
        draw();
      });
      document.getElementById('puzzle-reset').addEventListener('click', () => {
        current().reset();
        draw();
      });
      puzzleSelect.value = '333';
      showPuzzle();
    </script>
  </body>
</html>

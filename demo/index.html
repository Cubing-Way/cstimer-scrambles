<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cstimer-scrambles demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --fg: #1a1a1a;
        --muted: #666;
        --card: #fff;
        --border: #ddd;
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #eee;
          --muted: #999;
          --card: #1e1e1e;
          --border: #333;
          --accent: #60a5fa;
        }
      }
      body {
        margin: 0;
        padding: 32px 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
      }
      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      select,
      button,
      input[type='number'],
      textarea {
        font: inherit;
        padding: 8px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--fg);
      }
      input[type='number'] {
        width: 5em;
      }
      button {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      .colors {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 12px 0;
      }
      .colors label,
      .controls label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      input[type='color'] {
        width: 36px;
        height: 28px;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: none;
      }
      .moves {
        display: block;
        margin: 16px 0 0;
      }
      .moves span {
        display: block;
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      textarea {
        box-sizing: border-box;
        width: 100%;
        resize: vertical;
        font:
          1.1rem/1.6 ui-monospace,
          monospace;
        word-spacing: 0.3em;
      }
      .views {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 24px;
        margin: 16px 0;
      }
      /* Shown at the size set with setImageSize, but never wider than the page.
         The images have no background of their own, so they sit on the page. */
      #image {
        max-width: 100%;
      }
      /* The 3D view fills this box's width; drag it to turn the cube. */
      #cube3d {
        width: 260px;
        max-width: 100%;
      }
      #cube3d[hidden] {
        display: none;
      }
      #image svg {
        display: block;
        max-width: 100%;
        height: auto;
      }
      #event-scramble {
        margin: 16px 0 8px;
        padding: 20px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        font:
          1.5rem/1.6 ui-monospace,
          monospace;
        word-spacing: 0.3em;
        white-space: pre-wrap;
        min-height: 2em;
      }
      #event-image svg {
        display: block;
        width: 100%;
        max-width: 480px;
        height: auto;
        max-height: 360px;
      }
      /* Relays and multi-blind number each puzzle in black; use the page's text color. */
      #event-image svg > text[text-anchor='start'] {
        fill: var(--fg) !important;
      }
      h2 {
        margin-top: 48px;
      }
      .meta {
        color: var(--muted);
        font-size: 0.9rem;
      }
      .error {
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>cstimer-scrambles</h1>
      <p class="meta">
        csTimer's scramble generators running in your browser.
        <a href="https://github.com/Cubing-Way/cstimer-scrambles">Source on GitHub</a>
      </p>
      <div class="controls">
        <select id="puzzle" aria-label="Puzzle"></select>
        <select id="method" aria-label="Scramble method"></select>
        <label>Length <input id="length" type="number" min="1" max="999" /></label>
        <label>Size <input id="size" type="range" min="100" max="480" value="300" /></label>
        <button id="next">New scramble</button>
      </div>
      <div class="colors" id="colors"></div>
      <label class="moves">
        <span id="scramble-label">Scramble</span>
        <textarea id="scramble" rows="2" spellcheck="false"></textarea>
      </label>
      <label class="moves">
        <span id="solution-label">Solution</span>
        <textarea
          id="solution"
          rows="2"
          spellcheck="false"
          placeholder="Type moves here"
        ></textarea>
      </label>
      <div class="views">
        <div id="image"></div>
        <div id="cube3d" title="Drag to turn the cube"></div>
      </div>
      <p class="meta" id="info"></p>

      <h2>All scramble types</h2>
      <p class="meta">
        Every one of csTimer's scramble types, with <code>getScramble(type)</code> and
        <code>getScrambleImage(type, scramble)</code>.
      </p>
      <div class="controls">
        <select id="event" aria-label="Scramble type"></select>
        <button id="event-next">New scramble</button>
      </div>
      <div id="event-scramble"></div>
      <div id="event-image"></div>
      <p class="meta" id="event-info"></p>
    </main>
    <script type="module">
      import {
        Puzzle,
        listPuzzles,
        listEvents,
        getScramble,
        getScrambleImage,
        hasScrambleImage,
      } from './index.mjs';

      // One Puzzle object per puzzle, so each keeps its own settings and scramble.
      const puzzles = new Map(listPuzzles().map((id) => [id, new Puzzle(id)]));
      const $ = (id) => document.getElementById(id);
      const puzzleSelect = $('puzzle');
      const methodSelect = $('method');
      const lengthInput = $('length');
      const sizeInput = $('size');
      const colorsDiv = $('colors');
      const scrambleInput = $('scramble');
      const solutionInput = $('solution');
      const image = $('image');
      const cube3d = $('cube3d');
      const info = $('info');
      const scrambleLabel = $('scramble-label');
      const solutionLabel = $('solution-label');
      // How long each puzzle's last scramble() took, until its scramble is edited.
      const scrambleTimes = new Map();
      for (const [id, puzzle] of puzzles) puzzleSelect.append(new Option(puzzle.name, id));

      const current = () => puzzles.get(puzzleSelect.value);
      // <input type="color"> wants #rrggbb.
      const long = (c) => (c.length === 4 ? '#' + [...c.slice(1)].map((x) => x + x).join('') : c);

      const moves = (n) => `${n} ${n === 1 ? 'move' : 'moves'}`;

      function draw() {
        const puzzle = current();
        puzzle.setImageSize(Number(sizeInput.value));
        const ms = scrambleTimes.get(puzzle.id);
        scrambleLabel.textContent =
          `Scramble · ${moves(puzzle.getScrambleMoveCount())}` +
          (ms === undefined ? '' : ` · generated in ${ms.toFixed(0)} ms`);
        solutionLabel.textContent = `Solution · ${moves(puzzle.getSolutionMoveCount())}`;
        info.classList.remove('error');
        try {
          image.innerHTML = puzzle.getImage();
          // The cubes also get a 3D view, which keeps its angle when redrawn.
          cube3d.hidden = !puzzle.has3DView();
          if (puzzle.has3DView()) puzzle.show3D(cube3d);
          info.textContent = `csTimer scramble type: ${puzzle.getScrambleType()}`;
        } catch (e) {
          info.classList.add('error');
          info.textContent = e.message;
        }
      }

      // Shows the puzzle's scramble, solution and length in the inputs.
      function showMoves() {
        const puzzle = current();
        scrambleInput.value = puzzle.getScramble();
        // Megaminx scrambles are 7 lines.
        scrambleInput.rows = Math.max(2, scrambleInput.value.split('\n').length);
        solutionInput.value = puzzle.getSolution();
        const length = puzzle.getScrambleLength();
        lengthInput.disabled = length === undefined;
        lengthInput.value = length ?? '';
        lengthInput.title =
          length === undefined ? 'Random-state scrambles are as long as they need to be' : '';
        draw();
      }

      function next() {
        const start = performance.now();
        current().scramble();
        scrambleTimes.set(current().id, performance.now() - start);
        showMoves();
      }

      function showPuzzle() {
        const puzzle = current();
        methodSelect.replaceChildren(...puzzle.getScrambleMethods().map((m) => new Option(m, m)));
        methodSelect.value = puzzle.getScrambleMethod();
        colorsDiv.replaceChildren();
        for (const [face, color] of Object.entries(puzzle.getColors())) {
          const label = document.createElement('label');
          const input = document.createElement('input');
          input.type = 'color';
          input.value = long(color);
          input.addEventListener('input', () => {
            puzzle.setColor(face, input.value);
            draw();
          });
          label.append(input, face);
          colorsDiv.append(label);
        }
        // Every puzzle starts scrambled.
        if (!puzzle.getScramble()) next();
        else showMoves();
      }

      puzzleSelect.addEventListener('change', showPuzzle);
      methodSelect.addEventListener('change', () => {
        current().setScrambleMethod(methodSelect.value);
        next();
      });
      lengthInput.addEventListener('change', () => {
        const length = Number(lengthInput.value);
        if (Number.isInteger(length) && length >= 1) current().setScrambleLength(length);
        next();
      });
      sizeInput.addEventListener('input', draw);
      scrambleInput.addEventListener('input', () => {
        current().setScramble(scrambleInput.value);
        scrambleTimes.delete(current().id);
        draw();
      });
      solutionInput.addEventListener('input', () => {
        current().setSolution(solutionInput.value);
        draw();
      });
      $('next').addEventListener('click', next);
      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && e.target === document.body) {
          e.preventDefault();
          next();
        }
      });
      puzzleSelect.value = '333';
      showPuzzle();

      // All scramble types: the plain functions, one group per puzzle in registration order.
      const eventSelect = $('event');
      const eventScramble = $('event-scramble');
      const eventImage = $('event-image');
      const eventInfo = $('event-info');
      const groups = new Map();
      for (const event of listEvents()) {
        let group = groups.get(event.puzzle);
        if (!group) {
          group = document.createElement('optgroup');
          group.label = event.puzzle;
          groups.set(event.puzzle, group);
          eventSelect.append(group);
        }
        group.append(new Option(`${event.name} (${event.id})`, event.id));
      }

      function nextEvent() {
        const start = performance.now();
        const scramble = getScramble(eventSelect.value);
        const ms = performance.now() - start;
        eventScramble.textContent = scramble;
        eventInfo.textContent = `${moves(scramble.split(/\s+/).length)}, generated in ${ms.toFixed(0)} ms`;
        eventImage.innerHTML = hasScrambleImage(eventSelect.value)
          ? getScrambleImage(eventSelect.value, scramble)
          : '<p class="meta">No image for this puzzle.</p>';
      }

      eventSelect.addEventListener('change', nextEvent);
      $('event-next').addEventListener('click', nextEvent);
      nextEvent();
    </script>
  </body>
</html>

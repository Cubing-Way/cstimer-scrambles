<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cstimer-scrambles demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --fg: #1a1a1a;
        --muted: #666;
        --card: #fff;
        --border: #ddd;
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #eee;
          --muted: #999;
          --card: #1e1e1e;
          --border: #333;
          --accent: #60a5fa;
        }
      }
      body {
        margin: 0;
        padding: 32px 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
      }
      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      select,
      button,
      input[type='number'],
      textarea {
        font: inherit;
        padding: 8px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--fg);
      }
      input[type='number'] {
        width: 5em;
      }
      input:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .note {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .note[hidden] {
        display: none;
      }
      button {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      .colors {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 12px 0;
      }
      .colors label,
      .controls label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      input[type='color'] {
        width: 36px;
        height: 28px;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: none;
      }
      .moves {
        display: block;
        margin: 16px 0 0;
      }
      .moves span {
        display: block;
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      textarea {
        box-sizing: border-box;
        width: 100%;
        resize: vertical;
        font:
          1.1rem/1.6 ui-monospace,
          monospace;
        word-spacing: 0.3em;
      }
      .views {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 24px;
        margin: 16px 0;
      }
      /* Shown at the size set with setImageSize, but never wider than the page.
         The images have no background of their own, so they sit on the page. */
      #image {
        max-width: 100%;
      }
      /* The 3D view is as wide as the Size slider says; drag it to turn the cube. */
      #cube3d {
        max-width: 100%;
      }
      /* 2D or 3D: two buttons, the one in use filled in. */
      .toggle {
        display: inline-flex;
      }
      .toggle button {
        background: var(--card);
        border-color: var(--border);
        color: var(--fg);
      }
      .toggle button:first-child {
        border-radius: 6px 0 0 6px;
      }
      .toggle button:last-child {
        border-radius: 0 6px 6px 0;
        margin-left: -1px;
      }
      .toggle button[aria-pressed='true'] {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .toggle button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #cube3d[hidden] {
        display: none;
      }
      #image svg {
        display: block;
        max-width: 100%;
        height: auto;
      }
      /* Relays and multi-blind number each puzzle in black; use the page's text color. */
      #image svg > text[text-anchor='start'] {
        fill: var(--fg) !important;
      }
      #image[hidden] {
        display: none;
      }
      .meta {
        color: var(--muted);
        font-size: 0.9rem;
      }
      .error {
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>cstimer-scrambles</h1>
      <p class="meta">
        csTimer's scramble generators running in your browser.
        <a href="https://github.com/Cubing-Way/cstimer-scrambles">Source on GitHub</a>
      </p>
      <div class="controls">
        <select id="puzzle" aria-label="Puzzle"></select>
        <select id="type" aria-label="Scramble type"></select>
        <select id="method" aria-label="Scramble method"></select>
        <label
          >Length <input id="length" type="number" min="1" max="999" placeholder="n/a" />
          <span class="note" id="length-note">set by this scramble type</span></label
        >
        <label>Size <input id="size" type="range" min="100" max="480" value="300" /></label>
        <div class="toggle" role="group" aria-label="View">
          <button type="button" id="view-2d" aria-pressed="true">2D</button>
          <button type="button" id="view-3d" aria-pressed="false">3D</button>
        </div>
        <button id="next">New scramble</button>
      </div>
      <div class="colors" id="colors"></div>
      <label class="moves">
        <span id="scramble-label">Scramble</span>
        <textarea id="scramble" rows="2" spellcheck="false"></textarea>
      </label>
      <label class="moves">
        <span id="solution-label">Solution</span>
        <textarea
          id="solution"
          rows="2"
          spellcheck="false"
          placeholder="Type moves here"
        ></textarea>
      </label>
      <div class="views">
        <div id="image"></div>
        <div id="cube3d" title="Drag to turn the cube"></div>
      </div>
      <p class="meta" id="info"></p>
    </main>
    <script type="module">
      import { Puzzle, listPuzzles } from './index.mjs';

      // One Puzzle object per puzzle, so each keeps its own settings and scramble.
      const puzzles = new Map(listPuzzles().map((id) => [id, new Puzzle(id)]));
      const $ = (id) => document.getElementById(id);
      const puzzleSelect = $('puzzle');
      const typeSelect = $('type');
      const methodSelect = $('method');
      const lengthInput = $('length');
      const sizeInput = $('size');
      const view2D = $('view-2d');
      const view3D = $('view-3d');
      const colorsDiv = $('colors');
      const scrambleInput = $('scramble');
      const solutionInput = $('solution');
      const image = $('image');
      const cube3d = $('cube3d');
      const info = $('info');
      const scrambleLabel = $('scramble-label');
      const solutionLabel = $('solution-label');
      // How long each puzzle's last scramble() took, until its scramble is edited.
      const scrambleTimes = new Map();

      // The WCA puzzles, then every other puzzle csTimer has scrambles for.
      const WCA = [
        '222',
        '333',
        '444',
        '555',
        '666',
        '777',
        'clock',
        'minx',
        'pyram',
        'skewb',
        'sq1',
      ];
      const wca = document.createElement('optgroup');
      wca.label = 'WCA';
      const other = document.createElement('optgroup');
      other.label = 'Other puzzles';
      for (const [id, puzzle] of puzzles) {
        (WCA.includes(id) ? wca : other).append(new Option(puzzle.name, id));
      }
      puzzleSelect.append(wca, other);

      const current = () => puzzles.get(puzzleSelect.value);
      // <input type="color"> wants #rrggbb.
      const long = (c) => (c.length === 4 ? '#' + [...c.slice(1)].map((x) => x + x).join('') : c);

      let view = '2d';
      const moves = (n) => `${n} ${n === 1 ? 'move' : 'moves'}`;

      function draw() {
        const puzzle = current();
        puzzle.setImageSize(Number(sizeInput.value));
        const ms = scrambleTimes.get(puzzle.id);
        scrambleLabel.textContent =
          `Scramble · ${moves(puzzle.getScrambleMoveCount())}` +
          (ms === undefined ? '' : ` · generated in ${ms.toFixed(0)} ms`);
        solutionLabel.textContent = `Solution · ${moves(puzzle.getSolutionMoveCount())}`;
        // 3D only for the cubes; the other puzzles are shown in 2D, and the cubes go back
        // to the view picked last.
        view3D.disabled = !puzzle.has3DView();
        view3D.title = puzzle.has3DView() ? '' : 'Only the cubes have a 3D view for now';
        const in3D = view === '3d' && puzzle.has3DView();
        view2D.setAttribute('aria-pressed', String(!in3D));
        view3D.setAttribute('aria-pressed', String(in3D));
        image.hidden = in3D;
        cube3d.hidden = !in3D;
        info.classList.remove('error');
        info.textContent = `csTimer scramble type: ${puzzle.getScrambleType()}`;
        try {
          // The 3D view keeps its angle when redrawn.
          if (in3D) puzzle.show3D(cube3d);
          else if (puzzle.hasImage()) image.innerHTML = puzzle.getImage();
          else
            image.innerHTML = '<p class="meta">csTimer has no picture for this scramble type.</p>';
        } catch (e) {
          info.classList.add('error');
          info.textContent = e.message;
        }
      }

      // Shows the puzzle's scramble, solution, type, method and length in the inputs.
      function showMoves() {
        const puzzle = current();
        scrambleInput.value = puzzle.getScramble();
        fit(scrambleInput);
        solutionInput.value = puzzle.getSolution();
        typeSelect.value = puzzle.getScrambleType();
        // Blank when the type was picked from the list rather than by a method.
        methodSelect.value = puzzle.getScrambleMethod() ?? '';
        // Random-state and case scrambles are as long as they need to be: the box says
        // "n/a", greyed out, with the reason next to it.
        const length = puzzle.getScrambleLength();
        lengthInput.disabled = length === undefined;
        lengthInput.value = length ?? '';
        $('length-note').hidden = length !== undefined;
        draw();
      }

      // Grows a box to show all its lines (megaminx scrambles and relays are several).
      function fit(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = `${textarea.scrollHeight + 2}px`;
      }

      function next() {
        const start = performance.now();
        current().scramble();
        scrambleTimes.set(current().id, performance.now() - start);
        showMoves();
      }

      function showPuzzle() {
        const puzzle = current();
        typeSelect.replaceChildren(
          ...puzzle.getScrambleTypes().map((t) => new Option(`${t.name} (${t.id})`, t.id)),
        );
        methodSelect.replaceChildren(
          new Option('(type from the list)', '', false, false),
          ...puzzle.getScrambleMethods().map((m) => new Option(m, m)),
        );
        methodSelect.options[0].hidden = true;
        colorsDiv.replaceChildren();
        for (const [face, color] of Object.entries(puzzle.getColors())) {
          const label = document.createElement('label');
          const input = document.createElement('input');
          input.type = 'color';
          input.value = long(color);
          input.addEventListener('input', () => {
            puzzle.setColor(face, input.value);
            draw();
          });
          label.append(input, face);
          colorsDiv.append(label);
        }
        // Every puzzle starts scrambled.
        if (!puzzle.getScramble()) next();
        else showMoves();
      }

      puzzleSelect.addEventListener('change', showPuzzle);
      typeSelect.addEventListener('change', () => {
        current().setScrambleType(typeSelect.value);
        next();
      });
      methodSelect.addEventListener('change', () => {
        current().setScrambleMethod(methodSelect.value);
        next();
      });
      lengthInput.addEventListener('change', () => {
        const length = Number(lengthInput.value);
        if (Number.isInteger(length) && length >= 1) current().setScrambleLength(length);
        next();
      });
      sizeInput.addEventListener('input', draw);
      for (const [button, value] of [
        [view2D, '2d'],
        [view3D, '3d'],
      ]) {
        button.addEventListener('click', () => {
          view = value;
          draw();
        });
      }
      scrambleInput.addEventListener('input', () => {
        current().setScramble(scrambleInput.value);
        scrambleTimes.delete(current().id);
        fit(scrambleInput);
        draw();
      });
      solutionInput.addEventListener('input', () => {
        current().setSolution(solutionInput.value);
        draw();
      });
      $('next').addEventListener('click', next);
      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && e.target === document.body) {
          e.preventDefault();
          next();
        }
      });
      puzzleSelect.value = '333';
      showPuzzle();
    </script>
  </body>
</html>
